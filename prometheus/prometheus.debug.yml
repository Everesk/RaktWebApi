global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-service
    static_configs:
      - targets: ["host.docker.internal:7132"]
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true

  - job_name: bookings-service
    static_configs:
      - targets: ["host.docker.internal:7133"]
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true

  - job_name: users-service
    static_configs:
      - targets: ["host.docker.internal:7131"]
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
